<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>추억의 뽑기 - 질문 뽑기판</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="poster">
    <header class="poster-head">
      <h1><span>추억의</span><b>뽑기</b></h1>
      <div class="controls">
        <span class="remaining">남은 뽑기 <strong id="remaining">0</strong>개</span>
        <button type="button" id="reset" class="btn btn-reset">초기화</button>
      </div>
    </header>
    <p class="hint">하나를 골라 뜯어보세요! 나온 질문으로 이야기를 나눠요 🙂</p>
    <section id="board" class="board" aria-label="뽑기판"></section>
    <p id="empty" class="empty" hidden>모든 뽑기를 다 뽑았어요! 🎉 "초기화"를 눌러 다시 시작하세요.</p>
  </main>

  <div id="stage" class="stage" hidden aria-modal="true" role="dialog" aria-label="뽑은 질문">
    <div class="big" id="big">
      <div class="paper">
        <div class="paper-label">오늘의 질문</div>
        <p id="question" class="question"></p>
      <div class="free-panel" id="freePanel">
        <div class="paper-label">자유질문</div>
        <div id="freeSetup">
          <p class="free-q">오늘 함께하는 사람은 몇 명인가요?</p>
          <div class="stepper">
            <button type="button" id="minus" class="step" aria-label="한 명 줄이기">−</button>
            <input id="people" type="number" min="2" max="12" value="4" inputmode="numeric" aria-label="인원 수">
            <button type="button" id="plus" class="step" aria-label="한 명 늘리기">+</button>
          </div>
          <p class="free-note">2명부터 12명까지 가능해요.</p>
          <button type="button" id="makeWheel" class="btn btn-go">돌림판 만들기</button>
        </div>
        <div id="freeWheel" hidden>
          <div class="wheel-wrap">
            <div class="pointer" id="pointer"></div>
            <button type="button" id="wheelHit" class="wheel-hit" aria-label="돌림판 돌리기"><canvas id="wheel" style="width:230px;height:230px"></canvas></button>
          </div>
          <ul class="legend" id="legend"></ul>
          <p class="result" id="result"></p>
          <button type="button" id="redo" class="btn btn-small">인원 다시 정하기</button>
        </div>
      </div>
      </div>
      <div class="cover" id="cover"></div>
      <div class="flap" id="flap"></div>
    </div>
    <p id="tapHint" class="tap-hint">뽑기를 눌러서 뜯어보세요!</p>
    <button type="button" id="back" class="btn btn-back" hidden>뽑기판으로</button>
  </div>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
